<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#142B4D">
<meta name="description" content="Recomp Coach: track your meals, workouts and progress in your own account.">
<script src="./config.js"></script>
<meta charset="utf-8">
<title>Recomp Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Archivo:wght@400;500;600;700&display=swap">
<style>
/* Layout: single-column phone app, bottom tab bar, plate-colour coding (IWF plates) for kcal/macros */
:root{
  --bg:#ECEFEE; --surface:#FFFFFF; --surface2:#E2E7E5; --ink:#131917; --muted:#5A6762; --line:#D2D9D6;
  --kcal:#23874A; --pro:#C9322B; --carb:#C99300; --fat:#2253C4; --white-plate:#F4F6F5; --steel:#9AA5A1;
  --good:#23874A; --warn:#B87700; --bad:#C9322B;
  --btn:#131917; --btn-ink:#FFFFFF;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1312; --surface:#171D1B; --surface2:#212926; --ink:#E8EEEB; --muted:#93A19B; --line:#2B3430;
  --kcal:#46B86B; --pro:#EE5E50; --carb:#EBC03C; --fat:#5E8FF0; --white-plate:#DDE3E0; --steel:#6E7A76;
  --good:#46B86B; --warn:#E3A93A; --bad:#EE5E50; --btn:#E8EEEB; --btn-ink:#0F1312; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1312; --surface:#171D1B; --surface2:#212926; --ink:#E8EEEB; --muted:#93A19B; --line:#2B3430;
  --kcal:#46B86B; --pro:#EE5E50; --carb:#EBC03C; --fat:#5E8FF0; --white-plate:#DDE3E0; --steel:#6E7A76;
  --good:#46B86B; --warn:#E3A93A; --bad:#EE5E50; --btn:#E8EEEB; --btn-ink:#0F1312; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:env(safe-area-inset-top,0px) calc(92px + env(safe-area-inset-bottom,0px))}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:14px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:.01em;text-wrap:balance}
h1{font-size:30px;font-weight:700;line-height:1}
h2{font-size:21px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
h3{font-size:18px;font-weight:600}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--fat);outline-offset:2px}
.btn{background:var(--btn);color:var(--btn-ink);border-radius:999px;padding:11px 18px;font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
a.btn{text-decoration:none}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;background:var(--surface)}
.chip.on{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.seg{display:flex;background:var(--surface2);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;padding:8px 6px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:76px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.datenav{display:flex;align-items:center;gap:4px}
.datenav button{width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:18px;line-height:1}
.sync{font-size:11.5px;color:var(--muted);text-align:right}
/* budget */
.budget{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font-family:var(--display);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
.kv .num{font-size:19px;text-align:right}
.macro{display:flex;flex-direction:column;gap:5px}
.macro .lab{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.bar{height:9px;border-radius:5px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:1px}
/* lists */
.item{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:none}
.item .nm{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.item .sub{font-size:12.5px;color:var(--muted)}
.x{width:32px;height:32px;border-radius:50%;color:var(--muted);font-size:18px}
.x.arm{background:var(--bad);color:#fff;font-size:11px;font-weight:700;width:auto;padding:0 10px;border-radius:999px}
.mealhead{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:14px;color:var(--muted);font-size:14px;text-align:center}
.note{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:13.5px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:6px}
.tag.up{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.tag.hold{background:var(--surface2);color:var(--muted)}
.tag.down{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.tag.new{background:color-mix(in srgb,var(--fat) 16%,transparent);color:var(--fat)}
/* gym */
.daycard{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.daycard.next{border:2px solid var(--ink)}
.daynum{font-family:var(--display);font-size:30px;font-weight:700;width:46px;height:46px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center}
.ex{gap:10px}
.ex .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.scheme{font-family:var(--display);font-size:20px;font-weight:600;white-space:nowrap}
.sets{display:grid;grid-template-columns:34px 1fr 1fr 44px;gap:6px;align-items:center}
.sets .h{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.sets input{padding:8px;text-align:center}
.done{width:44px;height:40px;border-radius:10px;border:1.5px solid var(--line);font-weight:700}
.done.on{background:var(--good);border-color:var(--good);color:#fff}
.plates{display:flex;align-items:center;gap:2px;min-height:44px;overflow-x:auto}
.plates .bar-end{width:30px;height:8px;background:var(--steel);border-radius:2px}
.plates .sleeve{width:14px;height:12px;background:var(--steel)}
.pl{border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;writing-mode:vertical-rl;transform:rotate(180deg)}
.p25{background:#C9322B;width:16px;height:44px}.p20{background:#2253C4;width:15px;height:44px}.p15{background:#D6A300;width:14px;height:40px;color:#1a1a1a}
.p10{background:#23874A;width:13px;height:34px}.p5{background:#F4F6F5;width:11px;height:28px;color:#222;border:1px solid #bbb}.p25s{background:#C9322B;width:9px;height:22px;font-size:8px}.p125{background:#B8C0BD;width:8px;height:18px;font-size:7px;color:#222}
.vid{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.daywrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column}
.daywrap.next{border:2px solid var(--ink)}
.daywrap .daycard{border:none;background:none;width:100%}
.prevtog{border-top:1px solid var(--line);padding:10px 14px;font-size:13.5px;font-weight:600;color:var(--muted);text-align:left;width:100%}
.prev{padding:0 14px 14px;display:flex;flex-direction:column;gap:14px}
.prev .pe{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.plan.cur{border:2px solid var(--ink)}
.plan ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.plancard{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface2);border-radius:var(--r);padding:12px 14px}
.timer{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--btn);color:var(--btn-ink);border-radius:999px;padding:10px 16px;font-family:var(--display);font-size:20px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25)}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:600;color:var(--muted)}
nav.tabs button.on{color:var(--ink)}
nav.tabs svg{width:24px;height:24px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:600px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.review{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mini input{padding:7px 6px;text-align:center;font-size:15px}
.mini span{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.tile .num{font-size:28px;line-height:1.05}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--body);font-size:9.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:3px}
.ai-out{white-space:pre-wrap;font-size:14.5px}
.hero{background:var(--ink);color:var(--bg);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero .soft{opacity:.72}
.hgreet{font-weight:600;font-size:15px}
.lvl{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.04em;text-transform:uppercase;background:color-mix(in srgb,var(--bg) 16%,transparent);padding:4px 10px;border-radius:999px}
.streak{display:flex;align-items:center;gap:10px}
.streak svg{width:46px;height:46px;flex:none}
.sbig{font-family:var(--display);font-size:60px;font-weight:700;line-height:.85;font-variant-numeric:tabular-nums}
.slab{font-family:var(--display);font-size:20px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;line-height:1.05}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600}
.wd i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:14px;font-weight:800;border:2px solid color-mix(in srgb,var(--bg) 28%,transparent)}
.wd.full i{background:var(--kcal);border-color:var(--kcal);color:#fff}
.wd.part i{border-color:var(--kcal)}
.wd.today i{box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--carb)}
.wd.future{opacity:.4}
.xpbar,.jbar{height:10px;border-radius:5px;background:color-mix(in srgb,var(--bg) 18%,transparent);overflow:hidden;position:relative}
.xpbar i{display:block;height:100%;background:var(--carb);border-radius:5px;transition:width .6s ease}
.jbar i{display:block;height:100%;background:var(--kcal);border-radius:5px}
.quest{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line)}
.quest:first-of-type{border-top:none}
.qc{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;color:#fff}
.quest.qdone .qc{background:var(--kcal);border-color:var(--kcal)}
.quest.qdone .qn{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.qn{font-weight:600}
.qx{font-family:var(--display);font-weight:700;font-size:15px;color:var(--carb)}
.quest.qdone .qx{color:var(--muted)}
.qbar{display:flex;gap:4px}
.qbar span{flex:1;height:6px;border-radius:3px;background:var(--surface2)}
.qbar span.on{background:var(--kcal)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px 8px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.medal{width:56px;height:56px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:17px;box-shadow:inset 0 0 0 4px rgba(0,0,0,.18),inset 0 0 0 9px var(--c),inset 0 0 0 10px rgba(255,255,255,.35)}
.medal.dk{color:#1a1a1a}
.badge:not(.got) .medal{background:var(--surface2);color:var(--muted);box-shadow:inset 0 0 0 2px var(--line)}
.bn{font-weight:700;font-size:13px;line-height:1.2}
.bd{font-size:11.5px;color:var(--muted);line-height:1.25}
.toast.big{font-family:var(--display);font-size:20px;letter-spacing:.02em;background:var(--kcal);color:#fff;padding:12px 20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--btn);color:var(--btn-ink);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
@media (max-width:380px){.budget{grid-template-columns:1fr;justify-items:center}.kv{width:100%}}
</style>

ap:anywhere}

:root[data-theme="dark"]{--bg:#101A16;--surface:#19261F;--surface2:#24382B;--ink:#ECF4ED;--muted:#A7B9AC;--line:#34483A;--btn:#9CDDAB;--btn-ink:#15341F}

async function rpc(fn,...args){

 else if(fn==='authLogout')request={action:fn,token:args[0],args:[]};
 else if(fn==='authRequestCode'||fn==='authVerifyCode')request={action:fn,args:args};

   method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
   body:JSON.stringify(request),redirect:'follow',credentials:'omit',signal:controller.signal

 }catch(e){
  throw new Error(e.name==='AbortError'?'The server took too long. Check your inbox before requesting another code.':'Could not connect to the backend. Check your connection and try again.');
 }finally{clearTimeout(timeout)}
 const text=await response.text();let data;
 try{data=JSON.parse(text)}catch{throw new Error('The backend did not return JSON. Confirm its deployment is set to Me / Anyone and open the /exec URL to check it.');}
 if(!response.ok||!data.ok)throw new Error((data.code==='SESSION_EXPIRED'?'SESSION_EXPIRED: ':'')+(data.error||'The request failed.'));

}

function ticks(min,max,n=4){if(!isFinite(min)||!isFinite(max)){min=0;max=1}if(min===max){min-=1;max+=1}const raw=(max-min)/n,mag=10**Math.floor(Math.log10(raw)),e=raw/mag,st=(e>=7.5?10:e>=3.5?5:e>=1.5?2:1)*mag;const lo=Math.floor(min/st)*st,hi=Math.ceil(max/st)*st;const t=[];for(let v=lo;v<=hi+st*1e-6;v+=st)t.push(+v.toFixed(4));return {lo,hi,t}}
function chart({dates,bars=[],lines=[],refs=[],H=190,zero=false,unit=''}){
 const W=360,L=38,R=8,T=10,B=22,pw=W-L-R,ph=H-T-B,n=dates.length,band=pw/n;
 const vals=[...bars.flatMap(b=>b.vals),...lines.flatMap(l=>l.vals),...refs.map(r=>r.y)].filter(v=>v!=null&&isFinite(v));
 if(!vals.length)return '';
 let mn=Math.min(...vals),mx=Math.max(...vals);if(zero||bars.length)mn=Math.min(0,mn);
 const tk=ticks(mn,mx);const y=v=>T+ph-(v-tk.lo)/(tk.hi-tk.lo)*ph;const x=i=>L+(i+.5)*band;
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
 tk.t.forEach(v=>{s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${fmt(v)}${unit}</text>`});
 const every=Math.ceil(n/6);
 dates.forEach((d,i)=>{if(i%every===0||i===n-1&&n<=8)s+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${n<=7?fmtDate(d,{weekday:'short'}):fmtDate(d,{month:'short',day:'numeric'})}</text>`});
 bars.forEach(b=>{const bw=Math.min(22,band*.62);b.vals.forEach((v,i)=>{if(v==null||!v)return;const col=b.colorFn?b.colorFn(v,i):b.color;s+=`<rect x="${x(i)-bw/2}" y="${y(Math.max(v,tk.lo))}" width="${bw}" height="${Math.max(0,y(tk.lo)-y(v))}" rx="3" fill="${col}"/>`})});
 refs.forEach(r=>{s+=`<line x1="${L}" x2="${W-R}" y1="${y(r.y)}" y2="${y(r.y)}" stroke="${r.color}" stroke-width="1.5" stroke-dasharray="5 4"/>`;if(r.label)s+=`<text x="${W-R}" y="${y(r.y)-4}" text-anchor="end" style="fill:${r.color};font-weight:600">${esc(r.label)}</text>`});
 lines.forEach(l=>{let d='';l.vals.forEach((v,i)=>{if(v==null)return;d+=(d?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)});
  if(d)s+=`<path d="${d}" fill="none" stroke="${l.color}" stroke-width="${l.w||2}" ${l.dash?'stroke-dasharray="4 3"':''} stroke-linejoin="round" stroke-linecap="round"/>`;
  if(l.dots){const idx=l.vals.map((v,i)=>v==null?-1:i).filter(i=>i>=0);idx.forEach((i,k)=>{const last=k===idx.length-1;s+=`<circle cx="${x(i)}" cy="${y(l.vals[i])}" r="${last?4:2.6}" fill="${last?l.color:'var(--surface)'}" stroke="${l.color}" stroke-width="1.6"/>`})}});
 return `<div class="chart">${s}</svg></div>`;
}

/* progress view */
function vProgress(){
 if(!S.profile)return header('Progress',false)+`<div class="empty">Set your targets first.</div>`;
 const n={week:7,month:30,q:90}[S.range];const dates=Array.from({length:n},(_,i)=>addDays(today(),i-n+1));
 const infos=dates.map(dayInfo);const logged=infos.filter(i=>i.logged);
 const avg=k=>logged.length?logged.reduce((a,i)=>a+i.eat[k],0)/logged.length:0;
 const T=targets();const proHit=logged.filter(i=>i.eat.p>=i.T.protein*.9).length;
 const totDef=logged.reduce((a,i)=>a+i.deficit,0);
 const burned=infos.reduce((a,i)=>a+i.burn,0);
 const sessions=S.workouts.filter(w=>w.date>=dates[0]);const sports=infos.reduce((a,i)=>a+(i.day?.acts||[]).filter(x=>x.type!=='gym').length,0);
 // weight
 const wi=weighIns();const wInRange=dates.map(d=>{const x=wi.find(z=>z.d===d);return x?x.w:null});
 const avg7=dates.map(d=>{const pts=wi.filter(z=>z.d<=d&&z.d>addDays(d,-7));return pts.length?pts.reduce((a,z)=>a+z.w,0)/pts.length:null});
 const goal=num(P().goal);const cw=curW();
 const rwin=wi.filter(z=>z.d>addDays(today(),-28));let proj='';
 if(rwin.length>=3){const t0=new Date(rwin[0].d).getTime();const xs=rwin.map(z=>(new Date(z.d).getTime()-t0)/864e5),ys=rwin.map(z=>z.w);const mx=xs.reduce((a,b)=>a+b)/xs.length,my=ys.reduce((a,b)=>a+b)/ys.length;const sl=xs.reduce((a,x,i)=>a+(x-mx)*(ys[i]-my),0)/(xs.reduce((a,x)=>a+(x-mx)**2,0)||1);
  if(xs[xs.length-1]>=6){const wk=sl*7;proj=`Trend: ${wk<=0?'':'+'}${f1(wk)} kg/week.`;if(sl<0&&cw>goal)proj+=` At this pace you reach ${f1(goal)} kg around ${fmtDate(addDays(today(),Math.round((cw-goal)/-sl)),{month:'short',day:'numeric',year:'numeric'})}.`;if(wk<-1.2)proj+=' That is fast; muscle loss risk goes up above ~1% of bodyweight a week.'}}
 const wFirst=wi.filter(z=>z.d>=dates[0]);const wChange=wFirst.length>=2?wFirst[wFirst.length-1].w-wFirst[0].w:null;
 const waists=Object.entries(S.days).filter(([d,v])=>v?.waist&&d>=dates[0]).map(([d,v])=>({d,v:+v.waist})).sort((a,b)=>a.d<b.d?-1:1);
 const waistChange=waists.length>=2?waists[waists.length-1].v-waists[0].v:null;
 // strength
 const lifts=Object.keys(EX).filter(id=>!['bw','t'].includes(EX[id].k));
 let up=0,downN=0;lifts.forEach(id=>{const h=hist(id).filter(w=>w.date>=dates[0]).reverse();if(h.length<2)return;const b=w=>Math.max(...w.ex[id].filter(s=>num(s.r)>0).map(s=>e1rm(num(s.w),num(s.r))));const d=b(h[h.length-1])-b(h[0]);if(d>0)up++;else if(d<0)downN++});
 let verdict='Log your weight 3+ times a week and keep training to see recomposition signals here.';
 if(wChange!=null&&(up||downN)){
  if(wChange<0&&up>=downN)verdict='Weight is going down while your lifts go up. That is body recomposition: losing fat and keeping or building muscle.';
  else if(wChange<0&&downN>up)verdict='Weight is dropping but more lifts are going down than up. Eat closer to your budget on training days and keep protein high.';
  else if(Math.abs(wChange)<.4&&waistChange!=null&&waistChange<0)verdict='The scale is flat but your waist is shrinking and strength is holding. Fat is going down while muscle goes up.';
  else if(wChange>=0)verdict='Weight is flat or rising. Check that food logs are complete and portions are weighed, then trim about 150 kcal a day.';
 }
 const bf=num(P().bf);let abs='';
 if(bf){const lean=cw*(1-bf/100);const absBf=P().sex==='female'?20:12;abs=`<div class="note">At ${f1(bf)}% body fat you carry about ${f1(lean)} kg lean mass. Visible abs usually show around ${absBf}% for ${P().sex==='female'?'women':'men'}: roughly <b>${f1(lean/(1-absBf/100))} kg</b> at your current muscle, lower if you build more.</div>`}
 // strength chart
 const sh=hist(S.strEx).slice().reverse();const sd=sh.map(w=>w.date);const sv=sh.map(w=>Math.max(...w.ex[S.strEx].filter(s=>num(s.r)>0).map(s=>e1rm(num(s.w),num(s.r)))));
 const trained=lifts.filter(id=>hist(id).length);
 return header('Progress',false)+`
 <div class="seg" role="tablist">${[['week','7 days'],['month','30 days'],['q','90 days']].map(([k,l])=>`<button data-act="range" data-v="${k}" class="${S.range===k?'on':''}">${l}</button>`).join('')}</div>
 <div class="tiles">
  <div class="tile"><span class="eyebrow">Avg intake</span><span class="num">${fmt(avg('kcal'))}</span><span class="small muted">target ${fmt(T.kcal)} · ${logged.length}/${n} days logged</span></div>
  <div class="tile"><span class="eyebrow">Total deficit</span><span class="num">${fmt(totDef)}</span><span class="small muted">≈ ${f1(Math.max(0,totDef)/7700)} kg fat</span></div>
  <div class="tile"><span class="eyebrow">Protein days</span><span class="num">${proHit}<span class="muted" style="font-size:18px">/${logged.length}</span></span><span class="small muted">avg ${fmt(avg('p'))} of ${T.protein} g</span></div>
  <div class="tile"><span class="eyebrow">Training</span><span class="num">${sessions.length}<span class="muted" style="font-size:18px"> gym</span></span><span class="small muted">${sports} sport · ${fmt(burned)} kcal burned</span></div>
 </div>
 ${winsHTML()}<div class="card"><h2>Calories</h2>
  ${logged.length?chart({dates,bars:[{vals:infos.map(i=>i.logged?i.eat.kcal:null),colorFn:(v,i)=>v>infos[i].budget?'var(--bad)':'var(--kcal)'}],lines:[{vals:infos.map(i=>i.budget),color:'var(--ink)',w:1.5,dash:true}]}):'<div class="empty">Log meals to see your daily intake against budget.</div>'}
  <div class="legend"><span><i style="background:var(--kcal)"></i>Eaten, under budget</span><span><i style="background:var(--bad)"></i>Over budget</span><span><i style="background:var(--ink)"></i>Budget</span></div>
  ${logged.length?`<div class="stack">${[['Protein','p','protein','var(--pro)'],['Carbs','c','carbs','var(--carb)'],['Fat','f','fat','var(--fat)']].map(([l,k,t,c])=>`<div class="macro"><div class="lab"><span><span class="dot" style="background:${c}"></span>Avg ${l}</span><span class="num" style="font-size:16px">${fmt(avg(k))} <span class="muted">/ ${T[t]} g</span></span></div><div class="bar"><i style="width:${Math.min(100,avg(k)/T[t]*100)}%;background:${c}"></i></div></div>`).join('')}</div>`:''}
 </div>
 <div class="card"><h2>Weight</h2>
  <div class="row" style="gap:18px"><div class="stack" style="gap:0"><span class="eyebrow">Now</span><span class="num" style="font-size:26px">${f1(cw)} kg</span></div><div class="stack" style="gap:0"><span class="eyebrow">Change</span><span class="num" style="font-size:26px">${wChange==null?'–':(wChange>0?'+':'')+f1(wChange)+' kg'}</span></div><div class="stack" style="gap:0"><span class="eyebrow">To goal</span><span class="num" style="font-size:26px">${goal?f1(Math.max(0,cw-goal))+' kg':'–'}</span></div></div>
  ${wInRange.some(v=>v!=null)?chart({dates,lines:[{vals:avg7,color:'var(--fat)',w:2.5},{vals:wInRange,color:'var(--muted)',w:0,dots:true}],refs:goal?[{y:goal,color:'var(--kcal)',label:'Goal '+f1(goal)}]:[]}):'<div class="empty">No weigh-ins in this period. Add one in Today → Check-in.</div>'}
  <div class="legend"><span><i style="background:var(--fat)"></i>7-day average</span><span><i style="background:var(--muted)"></i>Weigh-ins</span>${goal?'<span><i style="background:var(--kcal)"></i>Goal</span>':''}</div>
  ${proj?`<p class="small muted" style="margin:0">${proj}</p>`:''}
 </div>
 <div class="card"><h2>Recomposition</h2>
  <div class="grid2"><div class="tile"><span class="eyebrow">Waist</span><span class="num">${waistChange==null?'–':(waistChange>0?'+':'')+f1(waistChange)+' cm'}</span></div><div class="tile"><span class="eyebrow">Lifts trending</span><span class="num">${up}↑ <span class="muted">${downN}↓</span></span></div></div>
  <div class="note">${verdict}</div>${abs}
 </div>
 <div class="card"><h2>Strength</h2>
  <select id="str-ex" aria-label="Exercise">${(trained.length?trained:lifts).map(id=>`<option value="${id}" ${id===S.strEx?'selected':''}>${EX[id].n}</option>`).join('')}</select>
  ${sv.length>=1?chart({dates:sd,lines:[{vals:sv,color:'var(--pro)',dots:true,w:2}]})+`<p class="small muted" style="margin:0">Estimated 1-rep max from your best set each session${EX[S.strEx].k==='db'?' (per dumbbell)':''}. Latest: <b>${f1(sv[sv.length-1])} kg</b>.</p>`:'<div class="empty">Log this exercise in a gym session to see its trend.</div>'}
 </div>
 <div class="card"><div class="row between"><h2>Coach review</h2><button class="btn sm" data-act="coach" ${S.coach?.busy?'disabled':''}>${S.coach?.busy?'<span class="spin"></span> Reviewing':'Review this period'}</button></div>
  ${S.coach?`<div class="ai-out">${esc(S.coach.text||'Thinking…')}</div>${S.coach.err?`<p class="small" style="color:var(--bad);margin:0">${esc(S.coach.err)}</p>`:''}`:'<p class="small muted" style="margin:0">The AI coach reads your logged numbers for this period and gives you what is working and what to change next week.</p>'}
 </div>`;
}

 </div>

 ${S.profile?`<button class="btn ${S.arm==='reset'?'danger':'line'}" data-act="reset">${S.arm==='reset'?'Tap again to erase everything':'Erase all data'}</button>`:''}</div>`;

 <div class="kv small"><span class="muted">Resting burn (Mifflin-St Jeor BMR)</span><span class="num" style="font-size:16px">${fmt(T.bmr)}</span><span class="muted">Daily burn before exercise</span><span class="num" style="font-size:16px">${fmt(T.tdee)}</span><span class="muted">Daily deficit</span><span class="num" style="font-size:16px">${fmt(T.deficit)}</span><span class="muted">Expected loss</span><span class="num" style="font-size:16px">${f1(T.deficit*7/7700)} kg/wk</span></div>

function renderSheet(){
 const s=S.sheet,root=$('#sheet-root');if(!s){root.innerHTML='';return}
 let body='';
 if(s.kind==='food'){
  const modes=[['describe','Describe'],...(AI_READY?[['photo','Photo']]:[]),['quick','Quick'],['manual','Manual']];

  <div class="row">${modes.filter(([k])=>AI_READY||!['describe','photo'].includes(k)).map(([k,l])=>`<button class="chip ${s.mode===k?'on':''}" data-act="fmode" data-v="${k}">${l}</button>`).join('')}</div>
  ${!AI_READY?'<p class="small muted" style="margin:0">AI food estimates are not enabled yet. You can still use Quick or Manual food logging.</p>':''}

async function estimate(){
 const s=S.sheet;if(!AI_READY||s.busy)return;
 const text=s.mode==='describe'?($('#ai-text')?.value||'').trim():'';
 if(s.mode==='describe'&&!text){s.err='Describe what you ate first.';renderSheet();return}
 if(s.mode==='photo'){s.hint=$('#ai-hint')?.value||''}
 s.text=text;s.busy=true;s.err='';s.items=null;renderSheet();
 const fmtSpec='Reply with only JSON: {"items":[{"name":string,"portion":string,"grams":number,"kcal":number,"protein":number,"carbs":number,"fat":number}],"note":string}. Macros in grams. "note" is one short sentence on any assumption you made (portion, cooking oil), or "".';
 const ctx='You estimate nutrition for a calorie and macro tracking app used in the Philippines. Use standard references (USDA FoodData Central, Philippine FNRI food composition tables) and typical Filipino home or carinderia portions when a dish is Filipino (1 cup cooked rice is about 160 g). List rice, viand (ulam), sides, sauces and drinks as separate items. If no amount is given assume one typical serving. Include cooking oil in fried dishes.';
 const prompt=s.mode==='photo'?`${ctx}\nThe attached photo shows a meal. Identify every food visible and estimate each portion from the plate, utensils and hand sizes in view.${s.hint?`\nThe user adds: ${s.hint}`:''}\n${fmtSpec}`:`${ctx}\nFood eaten: ${text}\n${fmtSpec}`;
 try{
  const res=await run('estimateFood',{prompt,image:s.mode==='photo'?await shrink(s.file):null});
  const items=(res?.items||[]).map(it=>({name:String(it.name||'Food'),portion:String(it.portion||''),kcal:num(it.kcal),p:num(it.protein),c:num(it.carbs),f:num(it.fat),mult:1})).filter(it=>it.kcal>0||it.p>0);
  if(!S.sheet)return;
  if(!items.length){s.err='No food found. Try a clearer photo or describe it in words.'}else{s.items=items;s.note=String(res.note||'');s.src=s.mode}
 }catch(e){if(!S.sheet)return;s.err=aiErr(e)}
 s.busy=false;renderSheet();
}
function addMeals(list){
 const d=S.date;const day=S.days[d]||(S.days[d]={meals:[],acts:[]});day.meals=day.meals||[];
 list.forEach(x=>day.meals.push({id:uid(),meal:S.sheet.meal,name:x.name,portion:x.portion||'',kcal:Math.round(x.kcal),p:+(+x.p).toFixed(1),c:+(+x.c).toFixed(1),f:+(+x.f).toFixed(1),src:x.src||'manual'}));
 saveDay(d);
}

async function coach(){
 if(!AI_READY){S.coach={text:'',err:'AI coaching is not enabled yet. Ask the app owner to finish the AI setup.'};render();return}
 const n={week:7,month:30,q:90}[S.range];const dates=Array.from({length:n},(_,i)=>addDays(today(),i-n+1));const T=targets();
 const days=dates.map(d=>{const i=dayInfo(d);return {date:d,kcal:i.logged?Math.round(i.eat.kcal):null,protein:i.logged?Math.round(i.eat.p):null,budget:i.budget,burnedActivity:Math.round(i.burn),weight:S.days[d]?.weight||null,waist:S.days[d]?.waist||null}});
 const lifts={};S.workouts.filter(w=>w.date>=dates[0]).forEach(w=>Object.entries(w.ex||{}).forEach(([id,sets])=>{const best=sets.filter(s=>num(s.r)>0).map(s=>`${s.w}kg×${s.r}`);if(best.length)(lifts[EX[id]?.n||id]=lifts[EX[id]?.n||id]||[]).push(`${w.date}: ${best.join(', ')}`)}));
 const data={profile:{sex:P().sex,age:P().age,heightCm:P().height,currentKg:curW(),goalKg:P().goal,bodyFatPct:P().bf||null,pace:P().pace},targets:{kcal:T.kcal,protein:T.protein,carbs:T.carbs,fat:T.fat,maintenanceBeforeExercise:Math.round(T.tdee)},days,lifts};
 const prompt=`You are a direct, supportive strength and nutrition coach. The user wants to lose fat while building muscle (body recomposition, visible abs). They follow the "${PLANS[planKey()].n}" gym plan and sometimes play pickleball or basketball. Review their last ${n} days of logs below. Days with kcal null were not logged.\n\nWrite 4 to 6 short bullet points starting with "- ": what is working, what to fix, and one specific action for next week. Use their real numbers. Plain text, no headings, no markdown bold. Do not give medical advice.\n\nDATA:\n${JSON.stringify(data)}`;
 S.coach={busy:true,text:''};render();
 try{S.coach.text=await run('coachReview',prompt);S.coach.busy=false}
 catch(e){S.coach={busy:false,text:e.text||'',err:aiErr(e)}}
 if(S.tab==='progress')render();
}

/* ---------- workout ---------- */
function startDay(key){
 const p=dayById(key);const recs={},ex={};
 p.ex.forEach(id=>{const r=rec(id);recs[id]=r;ex[id]=Array.from({length:EX[id].sets},()=>({w:r.w,r:'',done:false}))});
 S.draft={day:key,start:Date.now(),rec:recs,ex};draftSave();window.scrollTo(0,0);render();
}
function finish(){
 const D=S.draft,p=dayById(D.day);const min=Math.max(1,num($('#wo-min').value)||Math.round((Date.now()-D.start)/60000));
 const ex={};Object.entries(D.ex).forEach(([id,sets])=>{const s=sets.filter(x=>num(x.r)>0).map(x=>({w:num(x.w),r:num(x.r)}));if(s.length)ex[id]=s});
 if(!Object.keys(ex).length){toast('Enter reps for at least one set first.');return}
 const date=today();const w={id:'w'+uid(),date,day:D.day,min,kcal:actKcal(SPORTS.gym.met,min,curW(date)),ex};
 const prNotes=[];Object.entries(ex).forEach(([id,sets])=>{const e=EX[id];if(!e||e.k==='bw'||e.k==='t')return;const prev=hist(id);if(!prev.length)return;const pb=Math.max(...prev.map(x=>Math.max(...x.ex[id].filter(z=>num(z.r)>0).map(z=>e1rm(num(z.w),num(z.r))))));const top=sets.reduce((a,z)=>e1rm(z.w,z.r)>e1rm(a.w,a.r)?z:a);if(e1rm(top.w,top.r)>pb+.01)prNotes.push(`${e.n} ${f1(top.w)} kg × ${top.r}`)});
 S.workouts.push(w);saveWorkout(w);
 const day=S.days[date]||(S.days[date]={meals:[],acts:[]});day.acts=day.acts||[];
 day.acts.push({id:'g'+w.id,type:'gym',wid:w.id,name:`Gym · Day ${p.n} ${p.title}`,min,kcal:w.kcal});saveDay(date);
 S.draft=null;draftSave();S.rest=null;
 const ups=p.ex.filter(id=>ex[id]&&rec(id).act==='up').length;
 if(prNotes.length)celebrate('New PR! '+prNotes[0]+(prNotes.length>1?` +${prNotes.length-1} more`:''));else toast(`Saved. ${ups?`${ups} exercise${ups>1?'s':''} go up next time.`:'Beat your reps next time.'}`);
 S.date=date;render();
}

/* rest timer */
let restTick=null;
function renderTimer(){
 const r=$('#timer-root');if(!S.rest){r.innerHTML='';clearInterval(restTick);restTick=null;return}
 const left=Math.max(0,Math.ceil((S.rest-Date.now())/1000));
 r.innerHTML=`<button class="timer" data-act="stoprest" aria-label="Stop rest timer">${left?`${Math.floor(left/60)}:${pad(left%60)}`:'Go!'}</button>`;
 if(!restTick)restTick=setInterval(()=>{if(S.rest&&Date.now()>S.rest+4000)S.rest=null;renderTimer()},500);
}

const TQ=[];let tBusy=false;
function toast(m,big){TQ.push([m,big]);if(!tBusy)nextToast()}
function nextToast(){const it=TQ.shift();if(!it){tBusy=false;$('#toast-root').innerHTML='';return}tBusy=true;$('#toast-root').innerHTML=`<div class="toast ${it[1]?'big':''}" role="status">${esc(it[0])}</div>`;setTimeout(nextToast,it[1]?3200:2300)}
function celebrate(m){confetti();toast(m,true)}
function confetti(){
 if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const c=document.createElement('canvas'),dpr=window.devicePixelRatio||1,W=innerWidth,H=innerHeight;
 c.width=W*dpr;c.height=H*dpr;c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60';document.body.appendChild(c);
 const x=c.getContext('2d');x.scale(dpr,dpr);const cs=getComputedStyle(document.documentElement);
 const cols=['--kcal','--pro','--carb','--fat'].map(v=>cs.getPropertyValue(v).trim()||'#888');
 const P=Array.from({length:110},()=>({x:W/2+(Math.random()-.5)*60,y:H*.35,vx:(Math.random()-.5)*11,vy:-Math.random()*12-4,r:Math.random()*6+4,a:Math.random()*6,va:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*4)]}));
 const t0=performance.now();
 (function f(t){const k=(t-t0)/1900;x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.globalAlpha=Math.max(0,1-k);x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});if(k<1)requestAnimationFrame(f);else c.remove()})(t0);
}

  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}
 }
});
function guessMeal(){const h=new Date().getHours();return h<10?'Breakfast':h<15?'Lunch':h<17?'Snack':'Dinner'}


function accountHTML(){return `<div class="account-strip"><span class="account-avatar" aria-hidden="true">${esc((S.profile?.name||Account.name||Account.email).slice(0,1).toUpperCase())}</span><div class="account-copy"><strong>${esc(S.profile?.name||Account.name||'Your private space')}</strong><span>${esc(Account.email)}</span></div><span class="account-state" role="status">${esc(Cloud.status)}</span><button class="signout" data-act="signout">Sign out</button></div>`}
function welcomeHTML(){
 if(Account.ready)return `<section class="card welcome"><h1>Your tracker</h1><p role="status">${Account.error?'Could not load your records.':'Loading your records…'}</p>${Account.error?'<button class="btn" data-act="retry">Try again</button>':'<span class="spin" aria-label="Loading"></span>'}<button class="btn line" data-act="signout">Sign out</button></section>`;
 const signup=Login.mode==='signup';
 return `<section class="card welcome"><span class="welcome-mark" aria-hidden="true">R</span><span class="eyebrow">RECOMP COACH</span><h1>${Login.ticket?'Check your email':signup?'Start your journey':'Welcome back'}</h1><p class="muted">${Login.ticket?`Enter the eight-digit code sent to ${esc(Login.email)}. It expires in 10 minutes.`:'Your meals, workouts and progress. One private account.'}</p>
 ${!Login.ticket?`<div class="login-tabs"><button data-act="loginmode" data-v="signin" class="${!signup?'on':''}" aria-pressed="${!signup}" ${Login.busy?'disabled':''}>Sign in</button><button data-act="loginmode" data-v="signup" class="${signup?'on':''}" aria-pressed="${signup}" ${Login.busy?'disabled':''}>Create account</button></div>`:''}
 <form id="login-form" class="login-form">
 ${Login.ticket?'<label class="f">Email verification code<input id="login-code" class="login-code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{8}" maxlength="8" required autofocus placeholder="00000000"></label>':`${signup?`<label class="f">Your name<input id="login-name" autocomplete="name" maxlength="60" required value="${esc(Login.name)}" placeholder="What should we call you?"></label>`:''}<label class="f">Email address<input id="login-email" type="email" autocomplete="email" maxlength="254" required value="${esc(Login.email)}" placeholder="you@example.com"></label>`}
 ${Account.error?`<div class="login-alert" role="alert">${esc(Account.error)}</div>`:''}
 <button class="btn block" type="submit" ${Login.busy?'disabled':''}>${Login.busy?'Please wait…':Login.ticket?'Verify & sign in':signup?'Create account with email':'Email me a sign-in code'}</button>
 </form>
 ${Login.ticket?`<button class="btn line" data-act="differentemail" ${Login.busy?'disabled':''}>Change email or request a new code</button>`:''}
 <p class="small muted">${Login.ticket?'Check your spam folder too. Only the newest code works.':'No password to remember. We email you a code to confirm it’s you. New accounts are created after verification.'}</p><p class="small muted">Your records stay in private Google Sheets managed by the app owner. Stay signed in on this device for up to 30 days. Sign out on a shared device.</p></section>`;
}
async function submitLogin(){
 if(Login.busy)return;
 const code=$('#login-code')?.value.trim();
 if(!Login.ticket){Login.email=$('#login-email').value.trim();Login.name=$('#login-name')?.value.trim()||'';}
 Login.busy=true;Account.error='';render();
 try{
  if(!Login.ticket){const r=await rpc('authRequestCode',Login.email,Login.name);Login.ticket=r.ticket;Login.email=r.email;}
  else{
   const r=await rpc('authVerifyCode',Login.ticket,code);sessionToken=r.token;
   persistSession(sessionToken);
   Login.ticket='';await bootAccount();
  }
 }catch(e){Account.error=accountError(e);}
 Login.busy=false;render();$('#login-code')?.focus();
}
function clearAccount(preserveStoredToken=false){
 if(LSD){try{localStorage.removeItem(LSD)}catch{}}
 if(LS){try{localStorage.removeItem(LS)}catch{}}
 sessionToken='';if(!preserveStoredToken){try{localStorage.removeItem(SESSION_KEY)}catch{}}try{sessionStorage.removeItem(SESSION_KEY)}catch{}
 Account.ready=false;Account.email='';Account.name='';Account.error='';Cloud.ok=false;Cloud.ready=false;
 S.profile=null;S.days={};S.workouts=[];S.draft=null;S.sheet=null;S.coach=null;S.rest=null;S.tab='today';S.arm=null;S.lastQ=null;S.planPicker=false;Library.q='';Library.group='all';Library.muscle='all';Library.days='all';Library.view='programs';
 $('#sheet-root').innerHTML='';$('#timer-root').innerHTML='';document.body.style.overflow='';
 LS='';LSD='';AI_READY=false;
}
async function signOut(){
 if(pendingSaves||saveFailed){toast('Wait for saves to finish. If a save failed, try that change again before signing out.');return}
 const token=sessionToken;syncStatus('Signing out…');
 try{await rpc('authLogout',token);clearAccount();Login.ticket='';Login.email='';Login.name='';Login.mode='signin';render();}
 catch(e){syncStatus('Sign-out failed');toast('Could not sign out. Check your connection and try again.');}
}
async function bootAccount(){
 Account.error='';Cloud.ok=false;
 if(!sessionToken){Account.ready=false;render();return}
 render();
 try{
  const a=await run('getAccount');
  Account.email=a.email;Account.name=a.name||'';Account.ready=true;LS='recomp-coach.sheets.'+a.cacheKey;LSD=LS+'.draft';
  S.profile=null;S.days={};S.workouts=[];S.draft=null;
  try{S.draft=JSON.parse(localStorage.getItem(LSD))||null}catch{}
  await Cloud.init();
 }catch(e){if(/SESSION_EXPIRED/.test(String(e.message||e)))clearAccount();Account.error=accountError(e);render()}
}

window.addEventListener('storage',e=>{
 if(e.key!==SESSION_KEY||e.newValue===sessionToken)return;
 clearAccount(true);sessionToken=e.newValue||'';
 if(sessionToken)bootAccount();else render();
});
document.addEventListener('submit',e=>{if(e.target.id==='login-form'){e.preventDefault();submitLogin()}});
/* boot */
if(!hist(S.strEx).length){const t=Object.keys(EX).find(id=>!['bw','t'].includes(EX[id].k)&&hist(id).length);if(t)S.strEx=t}
render();
bootAccount();
</script>
